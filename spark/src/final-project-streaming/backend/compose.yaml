services:
  trama-api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      KAFKA_TOPIC: ${TRAMA_KAFKA_TOPIC:-trama-commerce-final-events}
      DB_HOST: ${TRAMA_DB_HOST:-trama-postgres-final}
      DB_PORT: "5432"
      DB_NAME: ${TRAMA_DB_NAME:-trama_commerce_final}
      DB_USER: ${TRAMA_DB_USER:-trama_final_user}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting the API}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
    networks:
      - spark_cluster

networks:
  spark_cluster:
    external: true
    name: spark-cluster_default
