# Only used by run_kafka_e2e.sh with a unique Compose project name.
# No host ports, external networks, or persistent volumes.
services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: jdbc_test_user
      POSTGRES_PASSWORD: ${JDBC_TEST_PASSWORD:?Set a disposable JDBC_TEST_PASSWORD}
      POSTGRES_DB: trama_jdbc_test
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ../database/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ../database/jdbc_staging.sql:/docker-entrypoint-initdb.d/20-jdbc-staging.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U jdbc_test_user -d trama_jdbc_test"]
      interval: 2s
      timeout: 2s
      retries: 45

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
