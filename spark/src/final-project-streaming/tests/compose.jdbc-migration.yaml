# Disposable migration rehearsal. Docker Compose project name is unique per run.
services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${JDBC_TEST_PASSWORD:?Set a disposable JDBC_TEST_PASSWORD}
      POSTGRES_DB: postgres
      JDBC_TEST_PASSWORD: ${JDBC_TEST_PASSWORD:?Set a disposable JDBC_TEST_PASSWORD}
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ./init_migration_databases.sh:/docker-entrypoint-initdb.d/10-create-test-databases.sh:ro
      - ../database/schema.sql:/opt/trama/schema.sql:ro
      - ../database/jdbc_staging.sql:/opt/trama/jdbc_staging.sql:ro
    networks:
      default:
        aliases: [postgres-iteso, trama-postgres-final]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U trama_final_user -d trama_commerce_final"]
      interval: 2s
      timeout: 2s
      retries: 45

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9093,CONTROLLER://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9093 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
